<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vision Caméra</title>

  <script type="text/javascript" src="../js/EventEmitter2-master/lib/eventemitter2.js"></script>
  <script type="text/javascript" src="../js/roslibjs-develop/build/roslib.js"></script>
  <script type="text/javascript" src="vision_camera.js"></script>

  <link rel="stylesheet" href="vision_camera.css">
  <style>
    body {
      margin: 0;
      background: #080810;
      color: #e0e0e0;
      font-family: sans-serif;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      background: #0d0d1f;
      border-bottom: 1px solid rgba(0, 200, 255, 0.2);
    }

    header h1 {
      margin: 0;
      font-size: 1.2rem;
      color: #00e5ff;
    }

    #choix {
      display: flex;
      gap: 8px;
    }

    #choix button {
      background: #1a1a2e;
      color: #00e5ff;
      border: 1px solid #00e5ff;
      border-radius: 6px;
      padding: 5px 14px;
      cursor: pointer;
    }

    #choix button:hover {
      background: #00e5ff;
      color: #000;
    }

    #camera-section {
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .camera-feed {
      position: relative;
      width: 100%;
      max-width: 640px;
      background: #0a0a1a;
      border: 1px solid rgba(0, 200, 255, 0.3);
      border-radius: 8px;
      overflow: hidden;
    }

    .camera-feed img {
      width: 100%;
      height: auto;
      display: block;
    }

    .camera-label {
      position: absolute;
      top: 6px;
      left: 10px;
      font-size: 0.75rem;
      color: rgba(0, 200, 255, 0.8);
      background: rgba(0, 0, 0, 0.6);
      padding: 2px 8px;
      border-radius: 4px;
    }

    .no-signal {
      text-align: center;
      padding: 40px;
      color: rgba(0, 200, 255, 0.3);
      font-size: 0.9rem;
    }

    #ros-status-cam {
      font-size: 0.8rem;
      font-weight: bold;
    }
  </style>
</head>

<header>
  <h1>Vision Caméra</h1>
  <div id="choix">
    <a href="vision_camera.html"><button id="button_camera">Caméra</button></a>
    <a href="vision_lidar.html"><button id="button_lidar">LIDAR</button></a>
  </div>
  <span id="ros-status-cam">🔴 Déconnecté</span>
</header>

<body>
  <div id="camera-section">

    <div class="camera-feed">
      <span class="camera-label">Caméra principale</span>
      <img id="image_sub" alt="" onerror="this.src=''" style="min-height:200px; background:#050510;">
      <div class="no-signal" id="cam-no-signal">
        📷 En attente du flux caméra...<br>
        <small>Topic: /cv_camera/image_raw/compressed</small>
      </div>
    </div>

  </div>
</body>

</html>
