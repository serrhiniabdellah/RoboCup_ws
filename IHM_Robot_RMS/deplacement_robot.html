<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Déplacement robot</title>

  <script type="text/javascript" src="../js/EventEmitter2-master/lib/eventemitter2.js"></script>
  <script type="text/javascript" src="../js/roslibjs-develop/build/roslib.js"></script>
  <script type="text/javascript" src="deplacement_robot.js"></script>

  <link rel="stylesheet" href="deplacement_robot.css">
  <style>
    .telemetrie-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }

    .telemetrie-card {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(0, 200, 255, 0.2);
      border-radius: 6px;
      padding: 8px 12px;
    }

    .telemetrie-card h4 {
      margin: 0 0 4px;
      font-size: 0.75rem;
      color: rgba(0, 200, 255, 0.6);
      text-transform: uppercase;
    }

    .telemetrie-card .val {
      font-size: 1.1rem;
      font-weight: bold;
      color: #00e5ff;
    }

    .telemetrie-card .unit {
      font-size: 0.7rem;
      color: rgba(255, 255, 255, 0.4);
    }

    #ros-status {
      font-size: 0.8rem;
      padding: 3px 10px;
      border-radius: 12px;
      background: rgba(244, 67, 54, 0.2);
      color: #f44336;
      border: 1px solid #f44336;
    }

    #ros-status.connected {
      background: rgba(76, 175, 80, 0.2);
      color: #4caf50;
      border-color: #4caf50;
    }
  </style>
</head>

<header>
  <div>
    <h1>Déplacement</h1>
  </div>
  <div id="choix">
    <a href="deplacement_robot.html"><button id="button_robot">Robot</button></a>
    <a href="deplacement_bras.html"><button id="button_bras">Bras</button></a>
  </div>
  <span id="ros-status">🔴 Déconnecté</span>
</header>

<body>

  <div id="conteneur_page">
    <div id="conteneur_page_gauche">
      <h3>Télémétrie</h3>

      <div class="telemetrie-grid">
        <div class="telemetrie-card">
          <h4>Vitesse Gauche</h4>
          <span class="val" id="vitesse1">—</span>
          <span class="unit">m/s</span>
        </div>
        <div class="telemetrie-card">
          <h4>Vitesse Droite</h4>
          <span class="val" id="vitesse2">—</span>
          <span class="unit">m/s</span>
        </div>
        <div class="telemetrie-card">
          <h4>Inclinaison AV</h4>
          <span class="val" id="inclinaison1">—</span>
          <span class="unit">°</span>
        </div>
        <div class="telemetrie-card">
          <h4>Inclinaison AR</h4>
          <span class="val" id="inclinaison2">—</span>
          <span class="unit">°</span>
        </div>
      </div>

      <div class="telemetrie-card" style="margin-top:8px;">
        <h4>Boussole</h4>
        <span class="val" id="boussole">—</span>
        <span class="unit">°</span>
      </div>
    </div>


    <div id="conteneur_page_droite">

      <div id="conteneur_droite_haut">
        <h3>Contrôle du Robot</h3>
        <div id="conteneur_haut">
          <button class="button" onclick="deplacement_avant()">↑</button>
        </div>
        <div id="conteneur_milieu">
          <button class="button" onclick="deplacement_gauche()">←</button>
          <button class="button_stop" onclick="stop()">⏹️</button>
          <button class="button" onclick="deplacement_droite()">→</button>
        </div>
        <div id="conteneur_bas">
          <button class="button" onclick="deplacement_arriere()">↓</button>
        </div>
        <small style="color:rgba(255,255,255,0.3); font-size:0.7rem;">
          Clavier: Z/S/Q/D · Espace=Stop
        </small>
      </div>

      <div id="conteneur_droite_bas">
        <div id="sens">
          <div id="position">
            <div id="flipperAVG">
              <h3>Flippers /</h3>
              <div id="conteneur_haut">
                <button class="button" onclick="flipper_hautAVG()">↑</button>
              </div>
              <div id="conteneur_milieu">
                <button class="button_stop" onclick="stop()">⏹️</button>
              </div>
              <div id="conteneur_bas">
                <button class="button" onclick="flipper_basAVG()">↓</button>
              </div>
            </div>

            <div id="camera">
              <h3>/ Caméra</h3>
              <div id="conteneur_haut">
                <button class="button" onclick="camera_haut()">↑</button>
              </div>
              <div id="conteneur_milieu">
                <button class="button_stop" onclick="stop()">⏹️</button>
              </div>
              <div id="conteneur_bas">
                <button class="button" onclick="camera_bas()">↓</button>
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

</body>

</html>
